<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17231d" />
    <meta
      name="description"
      content="Stonefield is an original browser-based voxel survival game."
    />
    <title>Stonefield — A browser survival game</title>
  </head>
  <body>
    <div id="app">
      <main
        style="
          min-height: 100vh;
          display: grid;
          place-items: center;
          padding: 24px;
          box-sizing: border-box;
          background: #17231d;
          color: #f0ead8;
          font:
            16px/1.6 system-ui,
            sans-serif;
        "
      >
        <section
          style="
            max-width: 560px;
            padding: 32px;
            border: 1px solid #53614f;
            border-radius: 16px;
            background: #202e25;
          "
        >
          <p
            style="
              margin: 0 0 8px;
              color: #b6c59b;
              text-transform: uppercase;
              letter-spacing: 0.12em;
              font-size: 12px;
            "
          >
            Stonefield
          </p>
          <h1 style="margin: 0 0 12px; font-size: 32px">Run Stonefield locally</h1>
          <p style="margin: 0 0 16px">
            This source file needs Vite to compile the game. From the project folder, run:
          </p>
          <pre
            style="
              padding: 14px;
              border-radius: 8px;
              background: #111a15;
              color: #d7e8b6;
              overflow: auto;
            "
          >
npm run dev</pre>
          <p style="margin: 16px 0 0">Then open <code>http://localhost:5173/</code> to play.</p>
        </section>
      </main>
    </div>
    <script src="./runtime-config.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
