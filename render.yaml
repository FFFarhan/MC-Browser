services:
  - type: web
    name: stonefield-signaling
    runtime: node
    plan: free
    rootDir: server/signaling
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        sync: false
      - key: TURN_URLS
        value: stun:stun.cloudflare.com:3478
